name: Database Migration (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'server/migrations/**'
      - '.github/workflows/database-migrate.yml'

jobs:
  migrate:
    name: Apply Database Migrations to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect new migrations
        id: migrations
        run: |
          # Get list of changed migration files compared to previous tag
          PREV_REF=$(git rev-list --tags --max-count=1 2>/dev/null || echo "HEAD~1")
          MIGRATIONS=$(git diff $PREV_REF...HEAD --name-only -- "server/migrations/*.sql" | sort)

          if [ -z "$MIGRATIONS" ]; then
            echo "No migrations to apply"
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "Found migrations:"
            echo "$MIGRATIONS"
            COUNT=$(echo "$MIGRATIONS" | wc -l)
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$MIGRATIONS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.migrations.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install pnpm
        if: steps.migrations.outputs.count != '0'
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        if: steps.migrations.outputs.count != '0'
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to production
        if: steps.migrations.outputs.count != '0'
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          NUXT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
        run: pnpm migrate

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Migrations applied successfully to production"
          echo "Commit: ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Migration failed for production"
          echo "Commit: ${{ github.sha }}"
          exit 1
